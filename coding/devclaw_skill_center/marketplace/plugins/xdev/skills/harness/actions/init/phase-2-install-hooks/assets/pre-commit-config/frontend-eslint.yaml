# 前端质量检查（ESLint + TypeScript）
# 适用条件：检测到 .eslintrc.* 或 eslint.config.*

- repo: local
  hooks:
    - id: eslint
      name: "eslint --fix (lint)"
      language: system
      entry: bash -c 'npx eslint --fix .'
      files: '\.(ts|tsx|js|jsx)$'
      pass_filenames: false

    - id: tsc-check
      name: "tsc --noEmit (TypeScript type check)"
      language: system
      entry: bash -c 'npx tsc --noEmit'
      files: '\.(ts|tsx)$'
      pass_filenames: false
