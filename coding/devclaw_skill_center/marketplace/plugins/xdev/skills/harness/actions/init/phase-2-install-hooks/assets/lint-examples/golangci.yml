# golangci-lint v2 配置示例
# 针对 AI Agent 开发模式优化 — 重点检查 AI 常犯的代码质量问题
#
# 使用说明：这是参考基线，不是直接复制的模板。
# Agent 应根据仓库实际情况调整参数（funlen、cyclop 等）。
# 参见 references/lint-strategy-guide.md 了解每条规则的目的。
version: "2"

linters:
  default: standard
  enable:
    # --- 领域1: 错误处理不规范 ---
    - errcheck       # 捕获未检查的 err 返回值
    - errorlint      # 错误包装/比较的规范性
    - err113         # 要求使用 errors.New 而非 fmt.Errorf
    # --- 领域2: 函数过长 ---
    - funlen         # 函数行数限制（默认 120，可根据项目调整）
    # --- 领域3: 圈复杂度过高 ---
    - cyclop         # 圈复杂度限制
    - gocognit       # 认知复杂度限制
    # --- 领域4: 未使用代码 ---
    - unused         # 未使用的变量、函数
    - ineffassign    # 无效赋值
    - unparam        # 未使用的函数参数
    # --- 领域5: 重复代码 ---
    - dupl           # 代码块重复检测
    # --- 领域6: 魔数和硬编码 ---
    - goconst        # 频繁出现的字面量
    # --- 领域7: 拼写错误 ---
    - misspell       # 标识符和注释中的拼写错误
    # --- 其他 ---
    - unconvert      # 不必要的类型转换
    - bodyclose      # 忘记关闭 HTTP body
    - staticcheck    # 深度静态分析
    - govet          # go vet 检查
  exclusions:
    rules:
      # 测试文件豁免复杂度和长度检查
      - path: '.*_test\.go'
        linters:
          - cyclop
          - gocognit
          - funlen
          - err113
          - dupl
          - errcheck
          - bodyclose

linters-settings:
  cyclop:
    max-complexity: 15       # 根据项目实际调整
  funlen:
    lines: 120               # 根据项目实际调整
  gocognit:
    min-complexity: 20       # 根据项目实际调整
  goconst:
    min-len: 3
    min-occurrences: 3
  dupl:
    threshold: 100
  misspell:
    locale: US

output:
  show-stats: true
  sort-order:
    - file

issues:
  exclude-dirs:
    - vendor
  max-issues-per-linter: 50
  max-same-issues: 5
