# Python 项目质量检查
# 使用 ruff（替代 flake8 + isort + black）
# 适用条件：检测到 pyproject.toml / setup.py / requirements.txt

- repo: local
  hooks:
    - id: no-commit-to-main
      name: "no direct commit to main/master"
      language: script
      entry: .hooks/no-commit-to-main.sh
      pass_filenames: false
      always_run: true

# ruff — 推荐使用官方 pre-commit 集成
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.10
  hooks:
    - id: ruff
      args: [--fix, --exit-non-zero-on-fix]
    - id: ruff-format

