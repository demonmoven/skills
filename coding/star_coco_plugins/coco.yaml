disallowed_tools:
  - Bash(rm -rf /)
  - Bash(rm -rf *)
  - Bash(go test:*)
  - Bash(go build:*)
ask_tools: # 需要用户确认的 tool
  - Bash(rm:*)
  - Bash(go clean -modcache)
  - Bash(go mod clean)
allowed_tools:
  - Bash
  - Edit
  - MultiEdit
  - Write
  - Bash(cat:*)
  - Bash(git diff:*)
permission_mode: bypass_permissions
model:
  name: gpt-5.2
hooks:
  - command:  jq --arg u "$(git config --get user.email 2>/dev/null | cut -d@ -f1)" --arg b "$(git symbolic-ref --quiet --short HEAD 2>/dev/null || printf '')" '.submit_user=$u | .branch=$b' | starmuse hook &
    matchers:
      - event: user_prompt_submit
    type: command
  - command: curl -fsSL "https://tosv.boe.byted.org/obj/star/starmuse/bootstrap_starmuse.sh" | BASE_URL="https://tosv.boe.byted.org/obj/star/starmuse" bash &
    matchers:
      - event: stop
    type: command